<svg viewBox="0 0 400 580" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="emblem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#000000" floodOpacity="0.3" />
    </filter>
    <filter id="flame-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#F5B82E" />
      <stop offset="70%" stop-color="#D98A1B" />
      <stop offset="100%" stop-color="#9E5B0E" />
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="40%" stop-color="#FFDE59" />
      <stop offset="80%" stop-color="#E5A118" />
      <stop offset="100%" stop-color="#B3740A" />
    </linearGradient>
    <linearGradient id="red-ray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2E38" />
      <stop offset="50%" stop-color="#D90416" />
      <stop offset="100%" stop-color="#8A000A" />
    </linearGradient>
    <radialGradient id="flame-grad" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF275" />
      <stop offset="55%" stop-color="#FF9900" />
      <stop offset="90%" stop-color="#E62E00" />
      <stop offset="100%" stop-color="#800000" stop-opacity="0.2" />
    </radialGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#474747" />
      <stop offset="30%" stop-color="#222222" />
      <stop offset="70%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E50A8" />
      <stop offset="40%" stop-color="#0D3A8A" />
      <stop offset="80%" stop-color="#082A6B" />
      <stop offset="100%" stop-color="#041B4A" />
    </linearGradient>
    <linearGradient id="ribbon-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072052" />
      <stop offset="100%" stop-color="#03102C" />
    </linearGradient>
    <linearGradient id="book-pages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFEE8" />
      <stop offset="60%" stop-color="#EBD99A" />
      <stop offset="100%" stop-color="#B3934A" />
    </linearGradient>
  </defs>

  <g filter="url(#emblem-shadow)">
    <!-- Radiating Red Sunburst Rays -->
    <g transform="translate(200, 190)">
      <g transform="rotate(-85)"><polygon points="0,-146 17,-110 14,-10 -14,-10 -17,-110" fill="#F5B82E"/><polygon points="0,-143 14,-112 11,-12 -11,-12 -14,-112" fill="url(#red-ray)"/><line x1="0" y1="-10" x2="0" y2="-142" stroke="#FFF2A3" stroke-width="1" stroke-opacity="0.7"/></g>
      <g transform="rotate(-74)"><polygon points="0,-126 14,-90 11,-10 -11,-10 -14,-90" fill="#F5B82E"/><polygon points="0,-123 11,-92 8,-12 -8,-12 -11,-92" fill="url(#red-ray)"/></g>
      <g transform="rotate(-63)"><polygon points="0,-146 17,-110 14,-10 -14,-10 -17,-110" fill="#F5B82E"/><polygon points="0,-143 14,-112 11,-12 -11,-12 -14,-112" fill="url(#red-ray)"/></g>
      <g transform="rotate(-52)"><polygon points="0,-126 14,-90 11,-10 -11,-10 -14,-90" fill="#F5B82E"/><polygon points="0,-123 11,-92 8,-12 -8,-12 -11,-92" fill="url(#red-ray)"/></g>
      <g transform="rotate(-41)"><polygon points="0,-146 17,-110 14,-10 -14,-10 -17,-110" fill="#F5B82E"/><polygon points="0,-143 14,-112 11,-12 -11,-12 -14,-112" fill="url(#red-ray)"/></g>
      <g transform="rotate(-30)"><polygon points="0,-126 14,-90 11,-10 -11,-10 -14,-90" fill="#F5B82E"/><polygon points="0,-123 11,-92 8,-12 -8,-12 -11,-92" fill="url(#red-ray)"/></g>
      <g transform="rotate(-19)"><polygon points="0,-146 17,-110 14,-10 -14,-10 -17,-110" fill="#F5B82E"/><polygon points="0,-143 14,-112 11,-12 -11,-12 -14,-112" fill="url(#red-ray)"/></g>
      <g transform="rotate(-8)"><polygon points="0,-126 14,-90 11,-10 -11,-10 -14,-90" fill="#F5B82E"/><polygon points="0,-123 11,-92 8,-12 -8,-12 -11,-92" fill="url(#red-ray)"/></g>
      <g transform="rotate(0)"><polygon points="0,-146 17,-110 14,-10 -14,-10 -17,-110" fill="#F5B82E"/><polygon points="0,-143 14,-112 11,-12 -11,-12 -14,-112" fill="url(#red-ray)"/><line x1="0" y1="-10" x2="0" y2="-142" stroke="#FFF2A3" stroke-width="1.5"/></g>
      <g transform="rotate(8)"><polygon points="0,-126 14,-90 11,-10 -11,-10 -14,-90" fill="#F5B82E"/><polygon points="0,-123 11,-92 8,-12 -8,-12 -11,-92" fill="url(#red-ray)"/></g>
      <g transform="rotate(19)"><polygon points="0,-146 17,-110 14,-10 -14,-10 -17,-110" fill="#F5B82E"/><polygon points="0,-143 14,-112 11,-12 -11,-12 -14,-112" fill="url(#red-ray)"/></g>
      <g transform="rotate(30)"><polygon points="0,-126 14,-90 11,-10 -11,-10 -14,-90" fill="#F5B82E"/><polygon points="0,-123 11,-92 8,-12 -8,-12 -11,-92" fill="url(#red-ray)"/></g>
      <g transform="rotate(41)"><polygon points="0,-146 17,-110 14,-10 -14,-10 -17,-110" fill="#F5B82E"/><polygon points="0,-143 14,-112 11,-12 -11,-12 -14,-112" fill="url(#red-ray)"/></g>
      <g transform="rotate(52)"><polygon points="0,-126 14,-90 11,-10 -11,-10 -14,-90" fill="#F5B82E"/><polygon points="0,-123 11,-92 8,-12 -8,-12 -11,-92" fill="url(#red-ray)"/></g>
      <g transform="rotate(63)"><polygon points="0,-146 17,-110 14,-10 -14,-10 -17,-110" fill="#F5B82E"/><polygon points="0,-143 14,-112 11,-12 -11,-12 -14,-112" fill="url(#red-ray)"/></g>
      <g transform="rotate(74)"><polygon points="0,-126 14,-90 11,-10 -11,-10 -14,-90" fill="#F5B82E"/><polygon points="0,-123 11,-92 8,-12 -8,-12 -11,-92" fill="url(#red-ray)"/></g>
      <g transform="rotate(85)"><polygon points="0,-146 17,-110 14,-10 -14,-10 -17,-110" fill="#F5B82E"/><polygon points="0,-143 14,-112 11,-12 -11,-12 -14,-112" fill="url(#red-ray)"/><line x1="0" y1="-10" x2="0" y2="-142" stroke="#FFF2A3" stroke-width="1" stroke-opacity="0.7"/></g>
    </g>

    <!-- Golden Sun Sphere / Disc -->
    <circle cx="200" cy="190" r="72" fill="url(#gold-bright)" stroke="#9E5B0E" stroke-width="3.5" />
    <circle cx="200" cy="190" r="66" fill="url(#gold-grad)" stroke="#FFF9D2" stroke-width="1.5" />
    <circle cx="200" cy="188" r="58" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Candle Flame -->
    <ellipse cx="200" cy="148" rx="22" ry="34" fill="url(#flame-grad)" opacity="0.4" filter="url(#flame-glow)" />
    <path d="M 200 115 C 208 135, 218 148, 216 160 C 214 172, 207 176, 200 176 C 193 176, 186 172, 184 160 C 182 148, 192 135, 200 115 Z" fill="url(#flame-grad)" />
    <path d="M 200 130 C 204 142, 209 152, 208 162 C 207 169, 203 172, 200 172 C 197 172, 193 169, 192 162 C 191 152, 196 142, 200 130 Z" fill="#FFFEE0" />
    <line x1="200" y1="172" x2="200" y2="182" stroke="#4A2500" stroke-width="2.5" stroke-linecap="round" />

    <!-- Candle Body -->
    <rect x="188" y="180" width="24" height="54" rx="3" fill="url(#gold-grad)" stroke="#7A4203" stroke-width="1.5" />
    <line x1="192" y1="181" x2="192" y2="233" stroke="#FFF7C2" stroke-width="2" stroke-opacity="0.8" />
    <ellipse cx="200" cy="180" rx="12" ry="3.5" fill="#FFEFA6" stroke="#9E5B0E" stroke-width="1" />

    <!-- Candle Dish / Base -->
    <path d="M 180 232 C 180 230, 190 228, 200 228 C 210 228, 220 230, 220 232 L 214 242 L 186 242 Z" fill="url(#gold-bright)" stroke="#8A4A02" stroke-width="1.5" />
    <ellipse cx="200" cy="242" rx="18" ry="4" fill="url(#gold-grad)" stroke="#693400" stroke-width="1" />

    <!-- 'บ' (Gold) -->
    <g transform="translate(132, 215)">
      <path d="M 12 68 C 12 40, 22 18, 42 12 C 58 7, 72 16, 75 32 C 73 34, 66 34, 62 25 C 53 18, 38 21, 34 38 L 34 82 L 72 82 L 72 25 L 88 25 L 88 98 L 18 98 C 14 98, 12 92, 12 85 Z" fill="#5C3400" />
      <path d="M 10 65 C 10 38, 20 16, 40 10 C 56 5, 70 14, 73 30 C 69 32, 63 31, 59 23 C 50 16, 36 19, 32 36 L 32 80 L 70 80 L 70 23 L 86 23 L 86 95 L 16 95 C 12 95, 10 89, 10 82 Z" fill="url(#gold-bright)" stroke="#9E5B0E" stroke-width="2" />
      <path d="M 14 65 C 14 42, 23 21, 40 14 C 47 11, 56 12, 63 18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
      <line x1="32" y1="36" x2="32" y2="80" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
    </g>

    <!-- 'ม' (Dark/Black) -->
    <g transform="translate(195, 215)">
      <path d="M 10 25 L 26 25 L 26 62 C 30 55, 38 52, 48 56 C 58 61, 62 70, 58 80 C 54 88, 44 92, 34 88 L 34 98 L 74 98 L 74 25 L 90 25 L 90 98 L 10 98 Z" fill="#050505" />
      <path d="M 8 23 L 24 23 L 24 60 C 28 53, 36 50, 46 54 C 56 59, 60 68, 56 78 C 52 86, 42 90, 32 86 L 32 95 L 72 95 L 72 23 L 88 23 L 88 95 L 8 95 Z" fill="url(#dark-metal)" stroke="url(#gold-bright)" stroke-width="2.5" />
      <line x1="12" y1="26" x2="12" y2="92" stroke="#A3A3A3" stroke-width="1.5" />
      <line x1="76" y1="26" x2="76" y2="92" stroke="#A3A3A3" stroke-width="1.5" />
      <circle cx="44" cy="70" r="7" fill="none" stroke="#F5B82E" stroke-width="2" />
    </g>

    <!-- Open Book -->
    <g transform="translate(50, 280)">
      <path d="M 150 78 C 90 62, 30 75, 10 88 L 10 102 C 30 89, 90 76, 150 92 C 210 76, 270 89, 290 102 L 290 88 C 270 75, 210 62, 150 78 Z" fill="#5E3A04" />
      <path d="M 150 74 C 90 58, 25 72, 5 85 L 5 95 C 25 82, 90 68, 150 84 C 210 68, 275 82, 295 95 L 295 85 C 275 72, 210 58, 150 74 Z" fill="url(#gold-grad)" stroke="#6E3D00" stroke-width="1.5" />
      <path d="M 150 68 C 95 53, 35 65, 15 77 L 15 85 C 35 73, 95 61, 150 76 C 205 61, 265 73, 285 85 L 285 77 C 265 65, 205 53, 150 68 Z" fill="url(#book-pages)" stroke="#D1B266" stroke-width="0.8" />
      <path d="M 150 62 C 95 47, 30 58, 15 68 L 15 76 C 30 66, 95 55, 150 70 C 205 55, 270 66, 285 76 L 285 68 C 270 58, 205 47, 150 62 Z" fill="#FFFDEB" stroke="#8A5A09" stroke-width="1.5" />
      <line x1="150" y1="62" x2="150" y2="88" stroke="#704400" stroke-width="3" />
      <line x1="149" y1="62" x2="149" y2="88" stroke="#FFE994" stroke-width="1" />
    </g>

    <!-- Ribbon -->
    <path d="M 52 385 L 18 368 L 48 340 L 80 348 L 74 380 Z" fill="url(#ribbon-fold)" stroke="#0F3375" stroke-width="1.2" />
    <polygon points="18,368 40,355 48,340" fill="#051838" />
    <path d="M 348 385 L 382 368 L 352 340 L 320 348 L 326 380 Z" fill="url(#ribbon-fold)" stroke="#0F3375" stroke-width="1.2" />
    <polygon points="382,368 360,355 352,340" fill="#051838" />
    <path d="M 45 348 C 120 334, 280 334, 355 348 C 362 385, 345 425, 332 435 C 265 410, 135 410, 68 435 C 55 425, 38 385, 45 348 Z" fill="url(#ribbon-grad)" stroke="#082A6B" stroke-width="2" />
    <path d="M 45 348 C 120 334, 280 334, 355 348" fill="none" stroke="url(#gold-bright)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 68 435 C 135 410, 265 410, 332 435" fill="none" stroke="url(#gold-bright)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Ribbon Text -->
    <path id="svg-ribbon-text-path" d="M 60 405 C 130 380, 270 380, 340 405" fill="none" />
    <text fill="#381D00" font-size="24.5" font-weight="800" font-family="'Prompt', 'Sarabun', sans-serif" letter-spacing="0.04em">
      <textPath href="#svg-ribbon-text-path" startOffset="50%" text-anchor="middle">
        โรงเรียนบ้านบวกหมื้อ
      </textPath>
    </text>
    <text fill="url(#gold-bright)" stroke="#874704" stroke-width="0.8" font-size="24" font-weight="800" font-family="'Prompt', 'Sarabun', sans-serif" letter-spacing="0.04em" dy="-1">
      <textPath href="#svg-ribbon-text-path" startOffset="50%" text-anchor="middle">
        โรงเรียนบ้านบวกหมื้อ
      </textPath>
    </text>
  </g>
</svg>
